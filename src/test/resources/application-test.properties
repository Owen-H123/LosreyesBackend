# =============================================================================
# De los Reyes ERP — application-test.properties
# Perfil de TEST: usa H2 en memoria, sin PostgreSQL, sin Flyway
# =============================================================================


# =============================================================================
# FLYWAY
# =============================================================================

spring.flyway.enabled=false


# =============================================================================
# DATABASE — H2 MEMORY
# =============================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=


# =============================================================================
# JPA / HIBERNATE
# =============================================================================

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


# =============================================================================
# LOGGING
# =============================================================================

logging.level.com.delosreyes=WARN

logging.level.org.hibernate.SQL=WARN

logging.level.org.flywaydb=WARN


# =============================================================================
# EMAIL — TEST SMTP
# =============================================================================

# No envía correos reales en pruebas — JavaMailSenderImpl solo intenta
# conectarse cuando se llama mailSender.send(...), así que estos valores
# nunca se usan a menos que un test invoque explícitamente EmailService
# sin mockear JavaMailSender.

spring.mail.host=localhost

spring.mail.port=2525

spring.mail.username=test

spring.mail.password=test


spring.mail.properties.mail.smtp.auth=false

spring.mail.properties.mail.smtp.starttls.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=5000

spring.mail.properties.mail.smtp.timeout=5000

spring.mail.properties.mail.smtp.writetimeout=5000