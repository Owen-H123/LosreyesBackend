# =============================================================================
# De los Reyes ERP — APPLICATION CONFIG
# Perfil DEV
# =============================================================================


# =============================================================================
# APPLICATION
# =============================================================================

spring.application.name=delosreyes-erp

spring.profiles.active=${APP_PROFILE:dev}


# =============================================================================
# SERVER
# =============================================================================

server.port=${SERVER_PORT:8080}

server.servlet.context-path=/api/v1


# =============================================================================
# DATABASE — PostgreSQL (Docker)
# =============================================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/delosreyes_erp}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD:postgres123}

spring.datasource.driver-class-name=org.postgresql.Driver


# =============================================================================
# HIKARI CONNECTION POOL
# =============================================================================

spring.datasource.hikari.pool-name=DelosReyesPool

spring.datasource.hikari.maximum-pool-size=15

spring.datasource.hikari.minimum-idle=5

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000

spring.datasource.hikari.keepalive-time=60000

spring.datasource.hikari.auto-commit=true

spring.datasource.hikari.leak-detection-threshold=0


# =============================================================================
# JPA / HIBERNATE
# =============================================================================

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.default_schema=public

spring.jpa.properties.hibernate.format_sql=true


# Performance tuning

spring.jpa.properties.hibernate.jdbc.batch_size=50

spring.jpa.properties.hibernate.order_inserts=true

spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

spring.jpa.properties.hibernate.generate_statistics=false


# =============================================================================
# FLYWAY
# =============================================================================

spring.flyway.enabled=true

spring.flyway.locations=classpath:db/migration

spring.flyway.schemas=public

spring.flyway.table=flyway_schema_history

spring.flyway.baseline-on-migrate=true

spring.flyway.validate-on-migrate=true

spring.flyway.out-of-order=false

spring.flyway.clean-disabled=true

spring.flyway.connect-retries=5


# =============================================================================
# SECURITY / JWT
# =============================================================================

jwt.secret=${JWT_SECRET:delosreyes-erp-super-secret-key-minimum-32-chars-dev}

jwt.expiration=86400000

jwt.refresh-expiration=604800000

jwt.issuer=delosreyes-erp


# =============================================================================
# LOGGING
# =============================================================================

logging.level.root=INFO

logging.level.com.delosreyes=DEBUG

logging.level.org.springframework=WARN

logging.level.org.hibernate.SQL=${LOG_SQL:false}

logging.level.org.flywaydb=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

logging.file.name=${LOG_PATH:./logs/delosreyes-erp.log}


# =============================================================================
# EMAIL — Resend (API HTTP, sin SMTP, sin contraseñas de Gmail)
# =============================================================================

# CORRECCIÓN: se agrega ":" (valor por defecto vacío) a RESEND_API_KEY y
# TEST_EMAIL_RECIPIENT. Antes, si esas variables de entorno no estaban
# definidas en la PC, Spring lanzaba "Could not resolve placeholder" y la
# app NO arrancaba (fallaba emailService → receiptService → receiptController
# → toda la app). Con ":" vacío, si no están definidas, simplemente quedan
# en "" y la app arranca igual. El envío de correos no funcionará hasta que
# definas RESEND_API_KEY con una key real, pero ya no bloquea el arranque.

resend.api-key=${RESEND_API_KEY:}

resend.from=onboarding@resend.dev


# Modo prueba: mientras no tengas un dominio verificado en Resend, todos los
# correos se redirigen a app.email.test-recipient (tu correo verificado en
# Resend), sin importar el email real del cliente. El asunto indica para
# quién era en realidad. Cuando verifiques un dominio propio, cambia
# app.email.test-mode a false y los correos irán directo al cliente.

app.email.test-mode=true

app.email.test-recipient=${TEST_EMAIL_RECIPIENT:}

# Recuperación de contraseña: el enlace del correo abre esta URL del frontend.
# En la red local, usar la IP del servidor (ej: http://192.168.1.50:3000) para
# que el enlace funcione desde otras PCs.
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.expiration-minutes=30

# Cookie del refresh token. Secure=true hace que el navegador solo la envíe por
# HTTPS. En la red local el sistema corre por HTTP, por eso es false por defecto.
# En producción con HTTPS: REFRESH_COOKIE_SECURE=true
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:false}

# CORS: orígenes desde donde el navegador puede llamar a la API, separados por coma.
#   http://*:3000 y http://*:5173 → frontend en desarrollo desde cualquier PC de la red
#   http://*:4173                 → vite preview
#   https://*.trycloudflare.com   → túnel temporal de Cloudflare para pruebas remotas
# En producción, dejar solo la dirección real del frontend (ej: https://erp.delosreyes.com).
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://*:3000,http://*:5173,http://*:4173,https://*.trycloudflare.com}
# =============================================================================
# ARCHIVOS — Imágenes de productos
# =============================================================================
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB